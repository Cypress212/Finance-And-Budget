<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#10b981">
    <title>Commander MK Pro</title>

    <link rel="manifest" href="./manifest.json">
    <link class="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454282.png">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Tweaked Light Theme Parameters */
        :root {
            --bg: #f1f5f9;          /* Crisp, premium slate-tinted off-white */
            --card: #ffffff;        /* Pure white for sharp card contrast */
            --border: #e2e8f0;      /* Clean, defined borders */
            --accent: #059669;      /* Slightly deeper, highly legible premium emerald */
            --text-main: #0f172a;   /* Deep slate for pristine readability */
            --text-dim: #64748b;    /* Balanced secondary text */
            --danger: #dc2626;      /* Vivid alert crimson */
            --shadow: rgba(15, 23, 42, 0.05) 0px 10px 15px -3px, rgba(15, 23, 42, 0.02) 0px 4px 6px -2px;
        }

        /* Dark Theme Parameters */
        html[data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #34d399;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        body {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
            display: flex; justify-content: center;
        }

        .dashboard {
            width: 100%; max-width: 1200px;
            padding: 15px;
            display: grid; grid-template-columns: 1fr; gap: 20px;
        }

        @media (min-width: 1024px) {
            .dashboard { grid-template-columns: 400px 1fr; padding: 40px; }
            .sticky-side { position: sticky; top: 40px; height: fit-content; }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.2px; margin: 0 0 15px 0; color: var(--text-dim); }
        .budget-value { font-size: 3rem; font-weight: 800; letter-spacing: -1.5px; margin: 5px 0; }

        input, select {
            width: 100%; border: 1px solid var(--border); padding: 16px; 
            margin-bottom: 12px; border-radius: 16px; background: var(--bg);
            color: var(--text-main); font-size: 16px; outline: none; transition: 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent); background: var(--card); }

        .currency-row {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%; padding: 18px; border: none; border-radius: 16px;
            font-weight: 700; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:active { transform: scale(0.97); filter: brightness(0.9); }
        
        .btn-secondary { 
            background: var(--bg); color: var(--text-main); 
            border: 1px solid var(--border); padding: 12px; font-size: 0.8rem; margin-bottom: 8px;
        }
        .btn-secondary:hover { background: var(--card); }

        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px; border-radius: 16px; background: var(--bg);
            border: 1px solid var(--border); margin-bottom: 10px; width: 100%;
        }

        .item-info { flex: 1; min-width: 0; padding-right: 10px; }
        .item-info span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
        .item-info small { color: var(--text-dim); font-size: 0.75rem; }

        .del-btn { background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; padding: 8px; font-weight: bold; }

        .theme-toggle {
            position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
            border-radius: 50%; background: var(--card); border: 1px solid var(--border);
            color: var(--text-main); cursor: pointer; z-index: 1000; font-size: 1.4rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
        }

        .progress-track { height: 6px; width: 100%; background: var(--border); border-radius: 10px; margin: 15px 0; }
        .progress-bar { height: 100%; background: var(--accent); border-radius: 10px; transition: 0.6s ease; }
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        
        .flex-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<div class="dashboard">
    <div class="sticky-side">
        <div class="card" style="border-top: 5px solid var(--accent);">
            <h2>Daily Budget Left</h2>
            <div class="budget-value" id="dailyDisplay">0</div>
            <div class="progress-track"><div class="progress-bar" id="progBar"></div></div>
            <div id="mathLabel" style="font-size: 0.8rem; color: var(--text-dim);">Ready.</div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Deployment</h2>
            <div class="currency-row">
                <select id="foreignCurrency" onchange="convertCurrency()">
                    <option value="USD">USD</option>
                    <option value="ZAR">ZAR</option>
                </select>
                <input type="number" id="foreignAmt" placeholder="Foreign Amount" inputmode="decimal" oninput="convertCurrency()">
            </div>
            <input type="number" id="amt" placeholder="Amount (MK)" inputmode="decimal">
            <input type="text" id="desc" placeholder="Item/Description">
            <button class="btn btn-primary" onclick="addToBasket()">Add to Basket</button>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Monthly Target</h2>
            <input type="number" id="monthlyGoal" value="200000" oninput="updateUI()">
        </div>
        
        <div class="card" style="margin-top: 20px;">
            <h2>Data & Backups</h2>
            <div class="flex-buttons">
                <button class="btn btn-secondary" onclick="exportToCSV()">Export CSV</button>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">Import Backup</button>
            </div>
            <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importBackup(event)">
            <div id="archiveScoreboard" style="margin-top: 15px; font-size: 0.75rem; color: var(--text-dim);"></div>
        </div>
    </div>

    <div>
        <div class="card">
            <h2 id="basketHeader">Live Basket (0)</h2>
            <div id="basketTotal" style="font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 20px;">MK 0</div>
            <div id="basketList"></div>
            <button class="btn btn-primary" id="payBtn" style="display:none; margin-top: 15px;" onclick="checkout()">Confirm Purchase</button>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Operation History</h2>
            <div id="historyList" class="history-grid"></div>
            <button onclick="clearHistory()" style="background:none; border:none; color:var(--danger); width:100%; margin-top:20px; font-size:0.7rem; cursor:pointer; font-weight: bold; opacity: 0.6;">WIPE ALL SYSTEM DATA</button>
        </div>
    </div>
</div>

<script>
    let entries = JSON.parse(localStorage.getItem('commander_v4_ledger') || "[]");
    let archives = JSON.parse(localStorage.getItem('commander_v4_archives') || "{}");
    let basket = [];
    let theme = localStorage.getItem('commander_theme') || 'light';

    const EXCHANGE_RATES = {
        USD: 1730, 
        ZAR: 95    
    };

    window.onload = () => { 
        applyTheme(); 
        checkMonthlyRollover();
        updateUI(); 
    };

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js?ver=6.0.0')
    .then((reg) => {
        reg.update();
        console.log("System ledger cache-busted version 6 active");
    })
    .catch(err => console.log("Worker connection error:", err));
}
    function convertCurrency() {
        const foreignAmtInput = document.getElementById('foreignAmt');
        const currencySelect = document.getElementById('foreignCurrency');
        const localAmtInput = document.getElementById('amt');

        const foreignAmount = parseFloat(foreignAmtInput.value);
        const selectedCurrency = currencySelect.value;

        if (!isNaN(foreignAmount) && foreignAmount > 0) {
            const convertedValue = Math.round(foreignAmount * EXCHANGE_RATES[selectedCurrency]);
            localAmtInput.value = convertedValue;
        } else {
            localAmtInput.value = '';
        }
    }

    function checkMonthlyRollover() {
        const now = new Date();
        const currentMonthKey = `${now.getFullYear()}-${now.getMonth()}`; 
        const lastCheckedMonth = localStorage.getItem('commander_last_month');

        if (lastCheckedMonth && lastCheckedMonth !== currentMonthKey) {
            const parsedLastMonth = lastCheckedMonth.split('-');
            const oldYear = parseInt(parsedLastMonth[0]);
            const oldMonth = parseInt(parsedLastMonth[1]);

            const lastMonthEntries = entries.filter(e => {
                const d = new Date(e.timestamp);
                return d.getFullYear() === oldYear && d.getMonth() === oldMonth;
            });

            if (lastMonthEntries.length > 0) {
                const totalSpent = lastMonthEntries.reduce((s, e) => s + e.amt, 0);
                const monthName = new Date(oldYear, oldMonth).toLocaleString('default', { month: 'long' });
                
                archives[`${monthName} ${oldYear}`] = totalSpent;
                localStorage.setItem('commander_v4_archives', JSON.stringify(archives));
            }
        }
        localStorage.setItem('commander_last_month', currentMonthKey);
    }

    function addToBasket() {
        const a = document.getElementById('amt'), d = document.getElementById('desc');
        const foreignAmtInput = document.getElementById('foreignAmt');
        if (!a.value || a.value <= 0) return;
        
        basket.push({ id: Date.now(), amt: parseFloat(a.value), desc: d.value || "General Item" });
        
        a.value = ''; 
        d.value = '';
        foreignAmtInput.value = ''; 
        updateUI();
    }

    function checkout() {
        if(basket.length === 0) return;
        basket.forEach(i => entries.unshift({ ...i, timestamp: Date.now() }));
        localStorage.setItem('commander_v4_ledger', JSON.stringify(entries));
        basket = []; updateUI();
    }

    function exportToCSV() {
        if(entries.length === 0) { alert("No history data to export."); return; }
        let csvContent = "data:text/csv;charset=utf-8,Description,Amount (MK),Date\n";
        entries.forEach(e => {
            const dateStr = new Date(e.timestamp).toLocaleDateString();
            const cleanDesc = e.desc.replace(/,/g, "");
            csvContent += `${cleanDesc},${e.amt},${dateStr}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `wealth_commander_backup_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    entries = importedData;
                    localStorage.setItem('commander_v4_ledger', JSON.stringify(entries));
                    updateUI();
                    alert("System ledger updated successfully from backup file!");
                } else { alert("Invalid backup format."); }
            } catch (err) { alert("Could not read backup file."); }
        };
        reader.readAsText(file);
    }

    function updateUI() {
        const goal = parseFloat(document.getElementById('monthlyGoal').value) || 1;
        const now = new Date();
        const spentThisMonth = entries
            .filter(e => new Date(e.timestamp).getMonth() === now.getMonth())
            .reduce((s, e) => s + e.amt, 0);

        const basketTotal = basket.reduce((s, e) => s + e.amt, 0);
        const daysLeft = (new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate()) + 1;
        
        const dailyAllowance = (goal - spentThisMonth) / daysLeft;
        const finalDaily = Math.floor(dailyAllowance - basketTotal);

        const display = document.getElementById('dailyDisplay');
        display.innerText = finalDaily.toLocaleString();
        display.style.color = finalDaily < 0 ? 'var(--danger)' : 'var(--accent)';

        document.getElementById('basketTotal').innerText = `MK ${basketTotal.toLocaleString()}`;
        document.getElementById('basketHeader').innerText = `Live Basket (${basket.length})`;
        document.getElementById('payBtn').style.display = basket.length > 0 ? 'block' : 'none';
        document.getElementById('mathLabel').innerText = `MK ${(goal - spentThisMonth).toLocaleString()} left this month • ${daysLeft} days remaining`;

        const percent = Math.min(100, Math.max(0, (spentThisMonth / goal) * 100));
        document.getElementById('progBar').style.width = percent + '%';

        let archiveHtml = "<b>Past Performance:</b><br>";
        const keys = Object.keys(archives);
        if(keys.length === 0) archiveHtml += "No archived months yet.";
        keys.forEach(k => { 
            const val = archives[k];
            const formattedVal = (typeof val === 'number') ? val.toLocaleString() : parseFloat(val || 0).toLocaleString();
            archiveHtml += `• ${k}: MK ${formattedVal}<br>`; 
        });
        document.getElementById('archiveScoreboard').innerHTML = archiveHtml;

        document.getElementById('basketList').innerHTML = basket.map(i => `
            <div class="item-row">
                <div class="item-info"><span>${i.desc}</span><small>MK ${i.amt.toLocaleString()}</small></div>
                <button class="del-btn" onclick="basket = basket.filter(x => x.id !== ${i.id}); updateUI();">X</button>
            </div>`).join('') || '<p style="opacity:0.4; text-align:center; font-size:0.9rem;">Basket is empty</p>';

        document.getElementById('historyList').innerHTML = entries.slice(0, 12).map(e => `
            <div class="item-row" style="background:transparent">
                <div class="item-info"><span>${e.desc}</span><small>${new Date(e.timestamp).toLocaleDateString()}</small></div>
                <b style="color:var(--text-main)">MK ${e.amt.toLocaleString()}</b>
            </div>`).join('');
    }

    // Remember to clear browser data after deploying to clear out cache layers!
    function clearHistory() { if(confirm("Wipe all data?")) { entries = []; localStorage.setItem('commander_v4_ledger', "[]"); updateUI(); } }
    function applyTheme() { document.documentElement.setAttribute('data-theme', theme); document.getElementById('themeBtn').innerText = theme === 'light' ? '🌙' : '☀️'; }
    function toggleTheme() { theme = (theme === 'light') ? 'dark' : 'light'; localStorage.setItem('commander_theme', theme); applyTheme(); }
</script>
</body>
</html>
